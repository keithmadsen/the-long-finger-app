name: CI

on:
  pull_request:
  push:
    branches: [main]

# Gate set: type-check + the two Vitest projects + the CSS token-name lint
# (added in Story 1.3 — the first web gate; epics.md Notes 14). Each step fails
# the build (blocks merge) on failure. The contrast-regression, axe-core,
# Playwright (forced-colors / reduced-motion / 200%-zoom) and bundle-size gates
# are deliberately deferred until the rendered list view exists (Story 1.6;
# epics.md Notes 14/18, C.14).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (all workspaces)
        run: npm run typecheck

      - name: CSS token-name lint (literal colors / off-scale px / focus-ring pairing)
        run: npm run lint:css

      - name: CSS token-name lint self-test (guards the gate itself)
        run: npm run lint:css:selftest

      - name: Web component tests (Vitest)
        run: npm run test --workspace apps/web

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Integration tests (Vitest)
        run: npm run test:integration
